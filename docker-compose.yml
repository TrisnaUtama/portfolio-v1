version: "3.8"

services:
  nextjs-dev:
    container_name: nextjs-portfolio-dev
    image: node:18-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
    command: sh -c "npm install && npm run dev"

  nextjs-prod:
    container_name: nextjs-portfolio-prod
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3001:3000"
    environment:
      NODE_ENV: production
    restart: always
